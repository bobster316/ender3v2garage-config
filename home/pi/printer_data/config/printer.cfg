# This file contains pin mappings for the Creality "v4.2.7" board. To
# use this config, during "make menuconfig" select the STM32F103 with
# a "28KiB bootloader" and serial (on USART1 PA10/PA9) communication.

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART3 PB11/PB10), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 40.0
damping_ratio_x: 0.10
shaper_type_y: mzv
shaper_freq_y: 38.0
damping_ratio_y: 0.10

[bltouch]
sensor_pin: ^PB1
control_pin: PB0
x_offset: -46
y_offset: -2


#[filament_switch_sensor Filament_runout_sensor]
#pause_on_runout: True
#runout_gcode:
#  G91
#  G1 Z20 F900
#  G90
#  G1 X245 Y218.5 F5000
#  G91
#  G1 E-450 F600
#  G90
#insert_gcode:
#  G4 P10000
#  G1 E150 F400
#switch_pin: PC6


[safe_z_home]
home_xy_position: 163.5, 119.5
z_hop: 10
z_hop_speed: 5


[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 5, 10
mesh_max: 199, 220
probe_count: 12, 12
zero_reference_position: 117.5, 117.5
mesh_pps: 2, 3
algorithm: bicubic
bicubic_tension: 0.
fade_start: 1
fade_end: 10
fade_target: 0


[delayed_gcode bed_mesh_init]
initial_duration: 0.01
gcode:
    BED_MESH_PROFILE LOAD=default


[stepper_x]
step_pin: PB9
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 245
homing_speed: 50


[stepper_y]
step_pin: PB7
dir_pin: PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 230
homing_speed: 50


[stepper_z]
step_pin: PB5
dir_pin: !PB6
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
#endstop_pin: ^PA7
#position_endstop: 0.0
position_max: 240
position_min: -2


[extruder]
max_extrude_only_distance: 700.0
max_extrude_cross_section: 5.0
step_pin: PB3
dir_pin: PB4
enable_pin: !PC3
microsteps: 16
rotation_distance: 22.929
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
#pid_kp: 24.545
#pid_ki: 1.136
#pid_kd: 132.544
min_temp: 0
max_temp: 300
pressure_advance: 0.035
pressure_advance_smooth_time: 0.04


[force_move]
enable_force_move: True


[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_kp: 73.035
#pid_ki: 1.902
#pid_kd: 701.138
min_temp: 0
max_temp: 130


[fan]
pin: PA0


[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command


[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 4.0


[board_pins]
aliases:
  EXP1_1=PC6,EXP1_3=PB10,EXP1_5=PB14,EXP1_7=PB12,EXP1_9=<GND>,
  EXP1_2=PB2,EXP1_4=PB11,EXP1_6=PB13,EXP1_8=PB15,EXP1_10=<5V>,
  PROBE_IN=PB0,PROBE_OUT=PB1,FIL_RUNOUT=PC6


[screws_tilt_adjust]
screw1: 76.5, 27.55
screw1_name: front left screw
screw2: 236.5, 27.5
screw2_name: front right screw
screw3: 236.5, 197.5
screw3_name: rear right screw
screw4: 76.5, 197.5
screw4_name: rear left screw
horizontal_move_z: 10.
speed: 50.
screw_thread: CW-M4


[exclude_object]


[gcode_macro PRINT_START]
description: OrcaSlicer print start with mesh load and purge line
gcode:
    {% set BED_TEMP = params.BED|default(55)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}

    M140 S{BED_TEMP}
    M104 S150
    G90
    M83

    G28
    BED_MESH_PROFILE LOAD=default

    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}

    G92 E0
    G1 Z2.0 F3000

    ; Double purge line on left side of bed
    G1 X5 Y20 F5000
    G1 Z0.28 F1200
    G1 X5 Y200 E12 F1000
    G1 X8 Y200 F5000
    G1 X8 Y20 E12 F1000

    G92 E0
    G1 Z2.0 F3000


[gcode_macro PRINT_END]
description: OrcaSlicer print end with safe lift and back-corner park
gcode:
    M400
    G91
    G1 E-2 F1800
    G1 Z10 F900
    G90

    ; Park print head at back-left corner
    G1 X10 Y220 F5000

    M104 S0
    M140 S0
    M106 S0
    BED_MESH_CLEAR
    M84


[gcode_macro SHOW_SPEED]
description: Show current G-code speed and speed factor
gcode:
    RESPOND MSG="GCODE_SPEED={printer.gcode_move.speed} mm/s"
    RESPOND MSG="SPEED_FACTOR={printer.gcode_move.speed_factor}"
    RESPOND MSG="MAX_VELOCITY={printer.toolhead.max_velocity} mm/s"
    RESPOND MSG="MAX_ACCEL={printer.toolhead.max_accel} mm/s^2"

